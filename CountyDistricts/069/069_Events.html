	<span class='yearText'>1881:</span><br>
	<p class='contentText'>The South Hoyt school district was organized.(Ref 89)</p>
	<br>

	<span class='yearText'>1885:</span><br>
	<p class='contentText'>The record attendance was recorded as 44 pupils. The teachers salary was $240. Pupils had surnames that included Aikens, 
	Barker, Bostwick, Cleland, Colborn, Hainline, Kirk and Schermerkorn(Ref 89)</p>
