	<span class='yearText'>1906:</span><br>
	<p class='contentText'>Alice Marshall (Wamego) attended this school. Her father, Thomas Marshall, Harry Tutt and John Summers Were on the school board for years. 
	There was no well at the schoolhouse so students carried water from Harry Tutt’s house.</p>
